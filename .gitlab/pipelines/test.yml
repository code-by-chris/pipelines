test:
  stage: test
  tags:
    - dev
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn test jacoco:report
  cache:
    paths:
      - .m2/repository
  artifacts:
    reports:
      junit: target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml
    paths:
      - target/site/jacoco/
      - target/surefire-reports/
  coverage: '/Total.*?([0-9]{1,3})%/'