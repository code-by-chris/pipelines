name: Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build JAR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: todo-api-jar
          path: target/*.jar
          retention-days: 14