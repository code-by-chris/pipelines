name: Test

on:
  workflow_call:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Unit & Integration Tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests (Surefire)
        run: mvn test

      - name: Generate JaCoCo Coverage Report
        run: mvn jacoco:report

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  e2e-tests:
    runs-on: ubuntu-latest
    name: E2E Tests (REST Assured)
    needs: unit-tests  # E2E erst nach erfolgreichen Unit-Tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run E2E Tests (Failsafe)
        run: mvn verify -DskipSurefire=true  # Failsafe läuft in der verify-Phase

      - name: Upload test reports
        if: always()  # Auch bei Fehlern hochladen
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7